name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Publication, catalogue and remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r remote/requirements.txt
      - run: python scripts/check_publication.py
      - run: python -m unittest discover -s cinema-launcher/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s remote/tests -p 'test_*.py' -v
      - run: node --check remote/static/app.js

  android:
    name: Clean Android build and policy fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.1.0'
      - run: zsh cinema-launcher/build.sh
      - run: zsh cinema-launcher/scripts/test_rules.sh

  mac:
    name: Native Mac shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: zsh remote/build-mac-app.sh
